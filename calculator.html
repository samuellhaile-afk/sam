<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      text-align: right;
    }

    .display .expression {
      color: #a0a0c0;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display .current {
      color: #e0e0ff;
      font-size: 36px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.1s ease;
      font-weight: 500;
    }

    button:active { transform: scale(0.94); }

    .btn-number {
      background: #1a1a4e;
      color: #e0e0ff;
    }

    .btn-number:hover { background: #22226a; }

    .btn-operator {
      background: #0f3460;
      color: #7ec8e3;
    }

    .btn-operator:hover { background: #1a4a7a; }

    .btn-equals {
      background: #e94560;
      color: white;
    }

    .btn-equals:hover { background: #ff5a75; }

    .btn-clear {
      background: #533483;
      color: #e0d0ff;
    }

    .btn-clear:hover { background: #6a40aa; }

    .span-two { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-clear" onclick="toggleSign()">+/-</button>
      <button class="btn-clear" onclick="percent()">%</button>
      <button class="btn-operator" onclick="setOperator('/')">÷</button>

      <button class="btn-number" onclick="inputDigit('7')">7</button>
      <button class="btn-number" onclick="inputDigit('8')">8</button>
      <button class="btn-number" onclick="inputDigit('9')">9</button>
      <button class="btn-operator" onclick="setOperator('*')">×</button>

      <button class="btn-number" onclick="inputDigit('4')">4</button>
      <button class="btn-number" onclick="inputDigit('5')">5</button>
      <button class="btn-number" onclick="inputDigit('6')">6</button>
      <button class="btn-operator" onclick="setOperator('-')">−</button>

      <button class="btn-number" onclick="inputDigit('1')">1</button>
      <button class="btn-number" onclick="inputDigit('2')">2</button>
      <button class="btn-number" onclick="inputDigit('3')">3</button>
      <button class="btn-operator" onclick="setOperator('+')">+</button>

      <button class="btn-number span-two" onclick="inputDigit('0')">0</button>
      <button class="btn-number" onclick="inputDot()">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let previous = '';
    let operator = null;
    let resetNext = false;

    const currentEl = document.getElementById('current');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      currentEl.textContent = current;
    }

    function inputDigit(digit) {
      if (resetNext) { current = digit; resetNext = false; }
      else current = current === '0' ? digit : current + digit;
      updateDisplay();
    }

    function inputDot() {
      if (resetNext) { current = '0.'; resetNext = false; updateDisplay(); return; }
      if (!current.includes('.')) { current += '.'; updateDisplay(); }
    }

    function setOperator(op) {
      if (operator && !resetNext) calculate(true);
      previous = current;
      operator = op;
      resetNext = true;
      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expressionEl.textContent = previous + ' ' + symbols[op];
    }

    function calculate(chaining = false) {
      if (!operator || resetNext) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;
      if (operator === '+') result = a + b;
      else if (operator === '-') result = a - b;
      else if (operator === '*') result = a * b;
      else if (operator === '/') result = b === 0 ? 'Error' : a / b;

      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      if (!chaining) expressionEl.textContent = previous + ' ' + symbols[operator] + ' ' + b + ' =';

      current = result === 'Error' ? 'Error' : String(parseFloat(result.toFixed(10)));
      operator = null;
      resetNext = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0'; previous = ''; operator = null; resetNext = false;
      expressionEl.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      current = String(parseFloat(current) * -1);
      updateDisplay();
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('-');
      else if (e.key === '*') setOperator('*');
      else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
